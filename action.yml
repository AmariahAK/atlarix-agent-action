name: Atlarix cloud agent
description: Runs a task you asked Atlarix for (from Slack or atlarix.dev) in this repository and opens a pull request.
author: Atlarix
branding:
  icon: git-pull-request
  color: purple

inputs:
  job-id:
    description: The Atlarix job to run. Passed by the workflow from the repository_dispatch payload.
    required: true
  api-url:
    description: The Atlarix cloud API. Only change this for a self-hosted or staging deployment.
    required: false
    default: https://cloud.atlarix.dev
  cli-version:
    description: The `atlarix` npm package version to run.
    required: false
    default: latest
  provider-key:
    description: >-
      Your own provider API key, for runs on your own key (pass a secret:
      `${{ secrets.ATLARIX_PROVIDER_KEY }}`). Ignored for runs on Atlarix models.
      Handed to Atlarix in a file it deletes, never in the environment the
      agent's commands can read.
    required: false
    default: ""
  provider:
    description: The provider of your own key (e.g. anthropic, openai, openrouter). Own-key runs only.
    required: false
    default: ""
  model:
    description: That provider's model id. Own-key runs only.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Run Atlarix
      shell: bash
      # Inputs reach the script as environment variables, never interpolated
      # into the script text, so a crafted value cannot become shell.
      env:
        ATLARIX_JOB_ID: ${{ inputs.job-id }}
        ATLARIX_API_URL: ${{ inputs.api-url }}
        ATLARIX_CLI_VERSION: ${{ inputs.cli-version }}
        # run.mjs removes the key from its own environment before anything starts.
        ATLARIX_PROVIDER_KEY: ${{ inputs.provider-key }}
        ATLARIX_PROVIDER: ${{ inputs.provider }}
        ATLARIX_MODEL: ${{ inputs.model }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"
